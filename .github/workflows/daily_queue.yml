name: Daily Queue Generator

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST (UTC+5:30)
  workflow_dispatch:

jobs:
  generate-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service account credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > service_account.json

      - name: Generate today's queue
        id: queue
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          TZ: Asia/Kolkata
        run: |
          python - << 'PYEOF'
          import os
          from app import prepare_daily_queue
          from datetime import datetime
          from zoneinfo import ZoneInfo

          results = prepare_daily_queue()
          today = datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%d %B %Y')

          if not results:
              summary = "No messages today."
              subject = "📨 WA Wishes — nothing today"
              tg_msg = f"📨 WA Wishes — no messages for {today}"
              lines = []
          else:
              lines = [f"• {r['name']} — {r['event_type'].title()}" for r in results]
              summary = '\n'.join(lines)
              count = len(results)
              subject = f"📨 WA Wishes — {count} message(s) for {today}"
              tg_msg = f"📨 *WA Wishes — {today}*\n\n" + summary + f"\n\n👉 https://sugamkuchhal.github.io/wa_automation/"

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"QUEUE_COUNT={len(results)}\n")
              f.write(f"QUEUE_SUBJECT={subject}\n")
              f.write(f"QUEUE_SUMMARY={summary.replace(chr(10), ' | ')}\n")
              f.write(f"QUEUE_DATE={today}\n")
              f.write(f"QUEUE_TG_MSG={tg_msg.replace(chr(10), '\\n')}\n")

          print(f"Queue ready: {len(results)} message(s)")
          for line in lines:
              print(line)
          PYEOF

      - name: Send Telegram notification
        if: success() && env.QUEUE_COUNT != '0'
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ "${{ secrets.TELEGRAM_BOT_TOKEN }}" != "placeholder" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="Markdown" \
              --data-urlencode "text=${{ env.QUEUE_TG_MSG }}"
          else
            echo "Telegram not configured yet — skipping"
          fi

      - name: Send email notification
        if: success() && env.QUEUE_COUNT != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: sugamkuchhal@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: sugam.kuchhal.iimc@gmail.com
          from: WA Automated Wishes <sugamkuchhal@gmail.com>
          subject: ${{ env.QUEUE_SUBJECT }}
          body: |
            Good morning! Here's your WhatsApp queue for ${{ env.QUEUE_DATE }}:

            ${{ env.QUEUE_SUMMARY }}

            Open dashboard to review and send:
            https://sugamkuchhal.github.io/wa_automation/

            — WA Automated Wishes

      - name: Clean up credentials
        if: always()
        run: rm -f service_account.json
