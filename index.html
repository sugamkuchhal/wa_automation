<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WA Automated Wishes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f7f7fb; padding: 14px; }

    h1 { font-size: 18px; font-weight: 700; color: #111; margin-bottom: 14px; }

    /* tabs */
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab { padding: 8px 18px; border-radius: 8px; border: 0; font-size: 14px; font-weight: 600; cursor: pointer; background: #e0e0e0; color: #444; }
    .tab.on { background: #222; color: white; }

    .pane { display: none; }
    .pane.on { display: block; }

    /* queue header */
    .qhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .qhead span { font-size: 13px; color: #666; }
    /* offline bar */
    #offline-bar { display: none; background: #fee2e2; color: #991b1b; padding: 9px 14px; border-radius: 9px; margin-bottom: 12px; font-size: 13px; font-weight: 600; text-align: center; }
    #offline-bar.on { display: block; }

    /* bulk bar */
    #bulk-bar { display: none; position: sticky; top: 0; z-index: 10; background: #25D366; color: white; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    #bulk-bar.on { display: flex; }
    #bulk-bar span { font-weight: 700; font-size: 13px; }
    #bulk-bar button { background: white; color: #1a7a42; border: 0; border-radius: 7px; padding: 6px 12px; font-weight: 700; cursor: pointer; font-size: 13px; }

    /* cards */
    .card { background: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 5px rgba(0,0,0,.08); position: relative; transition: opacity .3s; }
    .card.done { opacity: .45; }
    .card.skipped { opacity: .7; }
    .card.skipped .btn-unskip { opacity: 1 !important; pointer-events: auto !important; font-weight: 700; }
    .card.sel { outline: 2px solid #25D366; }
    .card.cascade { border-left: 4px solid #f0a500; }
    .ctitle { font-weight: 700; font-size: 14px; margin-bottom: 3px; color: #111; }
    .cmeta { font-size: 12px; color: #777; margin-bottom: 7px; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; margin-left: 6px; vertical-align: middle; }
    .b-ready   { background: #e8f0fe; color: #1a56db; }
    .b-edited  { background: #fff3cd; color: #856404; }
    .b-sent    { background: #d4f5e2; color: #1a7a42; }
    .b-skipped { background: #ececec; color: #666; }
    .msg { width: 100%; background: #f1f3f5; border-radius: 8px; padding: 9px; border: 1px solid #e3e6ea; font-size: 13px; line-height: 1.5; resize: vertical; }
    .msg.dirty { border-color: #f0a500; background: #fffbf0; }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .btn { padding: 8px 11px; border-radius: 7px; border: 0; font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
    .wa  { background: #25D366; color: white; }
    .ai  { background: #6c47ff; color: white; }
    .ai:disabled { opacity: .6; cursor: wait; }
    .sv  { background: #f0a500; color: white; }
    .sk  { background: #ddd; color: #333; }
    .cp  { background: #e8f0fe; color: #1a56db; }
    .cb  { position: absolute; top: 13px; right: 13px; width: 18px; height: 18px; accent-color: #25D366; cursor: pointer; }

    /* session overlay */
    #session { display: none; position: fixed; inset: 0; background: #f7f7fb; z-index: 100; overflow-y: auto; padding: 16px; }
    #session.on { display: block; }
    #sess-prog { font-size: 12px; color: #888; margin-bottom: 6px; }
    #sess-card { background: white; border-radius: 12px; padding: 14px; box-shadow: 0 1px 5px rgba(0,0,0,.1); }
    #sess-title { font-size: 16px; font-weight: 700; margin-bottom: 3px; color: #111; }
    #sess-meta  { font-size: 12px; color: #777; margin-bottom: 9px; }
    #sess-msg   { width: 100%; background: #f1f3f5; border-radius: 8px; padding: 9px; border: 1px solid #e3e6ea; font-size: 14px; min-height: 80px; }
    #sess-btns  { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    #sess-btns a, #sess-btns button { flex: 1; min-width: 100px; padding: 13px 8px; border-radius: 9px; font-weight: 700; font-size: 14px; border: 0; cursor: pointer; text-align: center; text-decoration: none; }
    #btn-ss { background: #25D366; color: white; }
    #btn-sk { background: #ddd; color: #333; }
    #btn-cp { background: #e8f0fe; color: #1a56db; }
    #sess-done { text-align: center; padding: 40px 0; display: none; }
    #sess-done h2 { font-size: 24px; margin-bottom: 8px; }

    /* history */
    .hfilter { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .hfilter select, .hfilter input { padding: 7px 10px; border-radius: 7px; border: 1px solid #ddd; font-size: 13px; background: white; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-bottom: 14px; }
    .stat { background: white; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    .stat-n { font-size: 24px; font-weight: 700; color: #111; }
    .stat-l { font-size: 11px; color: #777; margin-top: 2px; }
    .htbl { width: 100%; border-collapse: collapse; font-size: 12px; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.07); }
    .htbl th { text-align: left; padding: 8px 10px; background: #f1f3f5; color: #555; font-size: 11px; border-bottom: 1px solid #e3e6ea; }
    .htbl td { padding: 7px 10px; border-bottom: 1px solid #f5f5f5; color: #222; vertical-align: top; }
    .htbl tr:last-child td { border-bottom: none; }

    /* toast */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 9px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200; white-space: nowrap; }
    .toast.on { opacity: 1; }
  </style>
</head>
<body>

<h1>📨 WA Automated Wishes</h1>

<div class="tabs">
  <button class="tab on" onclick="showTab('queue',this)">Queue</button>
  <button class="tab" onclick="showTab('history',this)">History</button>
  <button class="tab" onclick="refreshCurrent()" title="Refresh" style="padding:8px 12px">&#8635;</button>
</div>

<!-- ── Queue pane ── -->
<div class="pane on" id="pane-queue">
  <div id="offline-bar">⚠️ Cannot reach server. <button onclick="loadQueue()" style="margin-left:8px;padding:3px 10px;border-radius:6px;border:0;background:#991b1b;color:white;font-size:12px;font-weight:700;cursor:pointer">Retry</button></div>
  <div class="qhead">
    <span id="q-date"></span>
    <button id="prep-btn" onclick="prepareQueue()" style="padding:8px 14px;border-radius:8px;border:0;background:#222;color:#fff;font-weight:600;font-size:13px;cursor:pointer">🔄 Prepare Queue</button>
  </div>
  <div id="bulk-bar">
    <span id="bulk-count">0 selected</span>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button onclick="selectAll()">Select All</button>
      <button onclick="startSession()" style="background:#1a7a42;color:white">▶ Start Session</button>
      <button onclick="clearSel()" style="background:#eee;color:#333">✕ Clear</button>
    </div>
  </div>
  <div id="root">Loading…</div>
</div>

<!-- ── History pane ── -->
<div class="pane" id="pane-history">
  <div class="hfilter">
    <select id="hist-days" onchange="loadHistory()">
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="0">All time</option>
    </select>
    <input type="text" id="hist-q" placeholder="Search name or event…" oninput="renderHistory()" style="flex:1;min-width:140px">
  </div>
  <div class="stats" id="hist-stats"></div>
  <div id="hist-body">Loading…</div>
</div>

<!-- ── Send session overlay ── -->
<div id="session">
  <div id="sess-prog"></div>
  <div id="sess-card">
    <div id="sess-title"></div>
    <div id="sess-meta"></div>
    <textarea id="sess-msg" rows="5"></textarea>
    <div id="sess-btns">
      <a id="btn-ss" href="#" target="_blank"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;vertical-align:middle"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>
      <button id="btn-cp" onclick="sessCopy()">📋 Copy</button>
      <button id="btn-sk" onclick="sessNext('skipped')">⏭ Skip</button>
    </div>
  </div>
  <div id="sess-done">
    <h2>🎉 All done!</h2>
    <p id="sess-summary" style="color:#777;font-size:13px;margin-bottom:14px"></p>
    <button class="btn wa" onclick="endSession()">Back to Dashboard</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzGcZiIqLzhrX2PjylcH7Aw8CB08fN_cA5OwHe9GqwvjpA4JaMYHKxgPx37Webb3qGR/exec';
const EMOJI = { birthday:'🎂', anniversary:'💍', diwali:'🪔', holi:'🎨', christmas:'🎄', 'new year':'🎉' };
const AI_COOLDOWN = 10000;

let allRows = [], selected = new Set(), sessQueue = [], sessIdx = 0, histRows = [];
const _belateSaved = new Set(); // tracks ids that have had belated text auto-saved this session

// ── Utilities ────────────────────────────────────────────────────────────────

function esc(v) {
  return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 2200);
}

function today() {
  return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}

const GAS_TIMEOUT_MS = 12000;
const GAS_MAX_RETRIES = 3;

async function _fetchWithTimeout(url, opts = {}) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), GAS_TIMEOUT_MS);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    clearTimeout(tid);
    return res;
  } catch(e) {
    clearTimeout(tid);
    throw e;
  }
}

async function _fetchWithRetry(url, opts = {}, retries = GAS_MAX_RETRIES) {
  for (let attempt = 0; attempt < retries; attempt++) {
    try {
      const res = await _fetchWithTimeout(url, opts);
      return res;
    } catch(e) {
      if (attempt < retries - 1) {
        // Exponential backoff: 1s, 2s, 4s
        await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
      } else {
        throw e;
      }
    }
  }
}

async function gasGet(params) {
  const url = GAS_URL + '?' + new URLSearchParams(params);
  const res = await _fetchWithRetry(url);
  return res.json();
}

async function gasPost(data) {
  const res = await _fetchWithRetry(GAS_URL, {
    method: 'POST',
    body: JSON.stringify(data)
  });
  return res.json();
}

// ── Tabs ─────────────────────────────────────────────────────────────────────

function showTab(name, btn) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  document.getElementById('pane-' + name).classList.add('on');
  btn.classList.add('on');
  if (name === 'queue')   loadQueue();
  if (name === 'history') loadHistory();
}

function refreshCurrent() {
  const activePane = document.querySelector('.pane.on');
  if (activePane && activePane.id === 'pane-history') loadHistory();
  else loadQueue();
}

// ── Queue ────────────────────────────────────────────────────────────────────

async function prepareQueue() {
  const btn = document.getElementById('prep-btn');
  btn.disabled = true; btn.textContent = '⏳ Preparing…';
  try {
    const data = await gasPost({ action: 'prepare' });
    if (data.ok) {
      toast('✅ Queue ready — ' + data.count + ' message(s)');
      await loadQueue();
    } else {
      toast('❌ ' + (data.error || 'Preparation failed'));
    }
  } catch(e) { toast('❌ Could not reach server'); }
  btn.disabled = false; btn.textContent = '🔄 Prepare Queue';
}

async function loadQueue() {
  _belateSaved.clear(); // reset on each load so belated auto-save re-fires if needed
  document.getElementById('offline-bar').classList.remove('on');
  try {
    const rows = await gasGet({ action: 'queue' });
    if (rows && rows.error) throw new Error(rows.error);
    allRows = Array.isArray(rows) ? rows : [];
    const todayStr2 = today();
    const pending = allRows.length;
    const missed = allRows.filter(r => r.queue_date !== todayStr2).length;
    document.getElementById('q-date').textContent = pending + ' pending' + (missed > 0 ? ' · ' + missed + ' from previous days' : '') + ' · ' + todayStr2;
    render(allRows);
  } catch(e) {
    document.getElementById('offline-bar').classList.add('on');
    document.getElementById('root').innerHTML = '';
  }
}

function render(rows) {
  const root = document.getElementById('root');
  if (!rows.length) { root.innerHTML = '<p style="color:#777;font-size:13px;padding:10px 0">No pending messages.</p>'; return; }
  const todayStr = today();
  const EVENT_ORDER = {'birthday':0,'cascade_birthday':1,'anniversary':2};
  const sorted = [...rows].sort((a,b) => {
    const ao = EVENT_ORDER[String(a.event_type||'').toLowerCase()] ?? 99;
    const bo = EVENT_ORDER[String(b.event_type||'').toLowerCase()] ?? 99;
    if (ao !== bo) return ao - bo;
    return String(a.queue_date).localeCompare(String(b.queue_date));
  });
  root.innerHTML = sorted.map(r => {
    const icon = EMOJI[String(r.event_type||'').toLowerCase()] || '✨';
    const status = r.action_status || 'ready';
    const isSkipped = status === 'skipped';
    const isSent = status === 'sent';
    const isMissed = r.queue_date !== todayStr;
    const hasMedia = !!r.media_url;

    // Auto-prepend Belated for missed messages not yet edited
    // Track saved ids so auto-save fires only once per session, not on every render
    let msgText = r.final_message_text || '';
    const needsBelated = isMissed && status === 'ready' &&
      !msgText.toLowerCase().startsWith('belated') &&
      !msgText.toLowerCase().startsWith('sorry');
    if (needsBelated) {
      msgText = 'Belated ' + msgText;
      if (!_belateSaved.has(r.id)) {
        _belateSaved.add(r.id);
        gasPost({ action: 'edit', id: r.id, text: msgText }).then(d => {
          if (d.ok && d.wa_link) {
            const wa = document.getElementById('wa-' + r.id);
            if (wa) wa.href = d.wa_link;
          }
        });
      }
    }

    const actionBtns = isSkipped
      ? `<button class="btn btn-unskip" style="background:#f0a500;color:white;opacity:1" onclick="unskip('${esc(r.id)}')">↩ Unskip</button>`
      : `<a class="btn wa" id="wa-${esc(r.id)}" href="${esc(r.wa_link)}" target="_blank" onclick="copyText('${esc(r.id)}'); mark('${esc(r.id)}','sent')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px;vertical-align:middle"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>
        <button class="btn sv" id="sv-${esc(r.id)}" style="display:none" onclick="saveEdit('${esc(r.id)}')">Save Edit</button>
        <button class="btn ai" id="ai-${esc(r.id)}" onclick="aiGen('${esc(r.id)}','${esc(r.name)}','${esc(r.event_type)}','${esc(r.relation||'')}','${esc(r.language||'en')}','${esc(r.tone||'warm')}')">✨ AI</button>
        <button class="btn cp" onclick="copyText('${esc(r.id)}')">Copy</button>
        ${hasMedia?`<button class="btn cp" onclick="shareMsg('${esc(r.id)}','${esc(r.media_url)}')">Share</button>`:''}
        <button class="btn sk" onclick="mark('${esc(r.id)}','skipped')">Skip</button>`;

    const isCascade = String(r.event_type||'').toLowerCase() === 'cascade_birthday';
    const cascadeBadge = isCascade ? `<span class="badge" style="background:#fff3cd;color:#856404">👶→parent</span>` : '';
    return `<div class="card${isSent?' done':isSkipped?' skipped':''}${isCascade?' cascade':''}" id="card-${esc(r.id)}">
      <input type="checkbox" class="cb" ${isSkipped||isSent?'disabled':''} onchange="toggleSel('${esc(r.id)}',this.checked)">
      <div class="ctitle">${icon} ${esc(r.name)} — ${esc(r.event_type)}
        <span class="badge b-${esc(status)}">${esc(status)}</span>
        ${cascadeBadge}
        ${isMissed ? `<span class="badge" style="background:#fce8e8;color:#c0392b">⚠ belated · ${esc(r.queue_date)}</span>` : ''}
      </div>
      <div class="cmeta">${esc(r.chat_type)} · ${esc(r.media_mode)} · ${esc(r.queue_date)}</div>
      <textarea class="msg" id="msg-${esc(r.id)}" rows="4" ${isSkipped?'disabled':''} oninput="onEdit('${esc(r.id)}')">${esc(msgText)}</textarea>
      ${hasMedia?`<div style="font-size:11px;color:#888;margin-top:4px">Media: ${esc(r.media_url)}</div>`:''}
      <div class="btns" id="btns-${esc(r.id)}">${actionBtns}</div>
    </div>`;
  }).join('');
}

function setStatus(id, status) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const badge = card.querySelector('.badge');
  badge.className = 'badge b-' + status;
  badge.textContent = status;
  if (status === 'sent') {
    card.classList.add('done');
    card.classList.remove('skipped');
  } else if (status === 'skipped') {
    card.classList.add('skipped');
    card.classList.remove('done');
  } else {
    card.classList.remove('done');
    card.classList.remove('skipped');
  }
}

function onEdit(id) {
  document.getElementById('msg-' + id).classList.add('dirty');
  document.getElementById('sv-' + id).style.display = 'inline-block';
}

async function mark(id, status) {
  const data = await gasPost({ action: 'mark', id, status });
  if (data.ok) {
    setStatus(id, status);
    toast(status === 'sent' ? '✅ Sent' : '⏭ Skipped');
    if (status === 'sent' || status === 'skipped') disableCard(id, status);
  }
}

function disableCard(id, status) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const cb = card.querySelector('.cb');
  if (cb) { cb.disabled = true; cb.checked = false; }
  const ta = document.getElementById('msg-' + id);
  const btnsEl = document.getElementById('btns-' + id);
  if (status === 'skipped') {
    if (ta) ta.disabled = true;
    if (btnsEl) btnsEl.innerHTML = `<button class="btn btn-unskip" style="background:#f0a500;color:white;opacity:1" onclick="unskip('${id}')">↩ Unskip</button>`;
  } else {
    // sent — disable everything
    card.querySelectorAll('button, a.btn').forEach(el => {
      el.disabled = true;
      el.style.opacity = '0.4';
      el.style.pointerEvents = 'none';
    });
  }
}

async function unskip(id) {
  const data = await gasPost({ action: 'mark', id, status: 'ready' });
  if (data.ok) {
    // Reload queue to get fresh state
    await loadQueue();
    toast('↩ Unskipped');
  }
}

async function saveEdit(id) {
  const text = document.getElementById('msg-' + id).value;
  const data = await gasPost({ action: 'edit', id, text });
  if (data.ok) {
    document.getElementById('msg-' + id).classList.remove('dirty');
    document.getElementById('sv-' + id).style.display = 'none';
    setStatus(id, 'edited');
    if (data.wa_link) document.getElementById('wa-' + id).href = data.wa_link;
    toast('💾 Saved');
  }
}

function copyText(id) {
  navigator.clipboard.writeText(document.getElementById('msg-' + id).value);
  toast('📋 Copied');
}

async function shareMsg(id, mediaUrl) {
  const text = document.getElementById('msg-' + id).value;
  if (navigator.share) {
    await navigator.share({ text: mediaUrl ? text + '\n' + mediaUrl : text });
  } else {
    copyText(id);
  }
}

// ── AI Generate ───────────────────────────────────────────────────────────────

async function aiGen(id, name, eventType, relation, language, tone) {
  const btn = document.getElementById('ai-' + id);
  const el  = document.getElementById('msg-' + id);
  btn.disabled = true; btn.textContent = '⏳';
  try {
    const data = await gasPost({
      action: 'ai_generate',
      id, name, event_type: eventType, relation, language, tone,
      current_text: el.value
    });
    if (data.ok) {
      el.value = data.text;
      onEdit(id);
      toast('✨ AI message ready — review before saving');
      _startAiCooldown(btn);
    } else {
      toast('❌ ' + (data.error || 'AI generation failed'));
      btn.disabled = false; btn.textContent = '✨ AI';
    }
  } catch(e) {
    toast('❌ AI error');
    btn.disabled = false; btn.textContent = '✨ AI';
    return;
  }
}

function _startAiCooldown(btn) {
  let s = AI_COOLDOWN / 1000;
  btn.textContent = `✨ AI (${s}s)`;
  const t = setInterval(() => {
    s--;
    if (s <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = '✨ AI'; }
    else btn.textContent = `✨ AI (${s}s)`;
  }, 1000);
}

// ── Selection ─────────────────────────────────────────────────────────────────

function toggleSel(id, checked) {
  checked ? selected.add(id) : selected.delete(id);
  document.getElementById('card-' + id).classList.toggle('sel', checked);
  updateBulkBar();
}

function updateBulkBar() {
  const n = selected.size;
  document.getElementById('bulk-count').textContent = n + ' selected';
  document.getElementById('bulk-bar').classList.toggle('on', n > 0);
}

function selectAll() {
  allRows.filter(r => r.action_status !== 'sent' && r.action_status !== 'skipped').forEach(r => {
    selected.add(r.id);
    const cb = document.querySelector('#card-' + r.id + ' .cb');
    if (cb) cb.checked = true;
    document.getElementById('card-' + r.id).classList.add('sel');
  });
  updateBulkBar();
}

function clearSel() {
  selected.forEach(id => {
    const cb = document.querySelector('#card-' + id + ' .cb');
    if (cb) cb.checked = false;
    document.getElementById('card-' + id)?.classList.remove('sel');
  });
  selected.clear(); updateBulkBar();
}

// ── Send session ──────────────────────────────────────────────────────────────

function startSession() {
  if (!selected.size) return;
  sessQueue = allRows.filter(r => selected.has(r.id));
  sessIdx = 0; clearSel();
  document.getElementById('session').classList.add('on');
  showSessCard();
}

function showSessCard() {
  const doneEl = document.getElementById('sess-done');
  const cardEl = document.getElementById('sess-card');
  if (sessIdx >= sessQueue.length) {
    cardEl.style.display = 'none'; doneEl.style.display = 'block';
    const sent = sessQueue.filter(r => r._s === 'sent').length;
    document.getElementById('sess-summary').textContent =
      sent + ' sent, ' + (sessQueue.length - sent) + ' skipped out of ' + sessQueue.length + ' messages.';
    return;
  }
  doneEl.style.display = 'none'; cardEl.style.display = 'block';
  const r = sessQueue[sessIdx];
  const icon = EMOJI[String(r.event_type||'').toLowerCase()] || '✨';
  document.getElementById('sess-prog').textContent = 'Message ' + (sessIdx+1) + ' of ' + sessQueue.length;
  document.getElementById('sess-title').textContent = icon + ' ' + r.name + ' — ' + r.event_type;
  document.getElementById('sess-meta').textContent = r.chat_type + ' · ' + r.media_mode;
  document.getElementById('sess-msg').value = r.final_message_text;
  const sb = document.getElementById('btn-ss');
  sb.href = r.wa_link || '#';
  sb.onclick = () => sessNext('sent');
}

async function sessNext(action) {
  const r = sessQueue[sessIdx];
  r._s = action;
  const text = document.getElementById('sess-msg').value;
  if (text !== r.final_message_text) {
    // skip_status=true so editRow only updates text+wa_link
    // markRow below sets the final action_status in one atomic write
    const d = await gasPost({ action: 'edit', id: r.id, text, skipStatus: true });
    if (d.ok && d.wa_link) { r.wa_link = d.wa_link; r.final_message_text = text; document.getElementById('btn-ss').href = d.wa_link; }
  }
  // Final status always set by mark — no timing ambiguity
  await gasPost({ action: 'mark', id: r.id, status: action });
  setStatus(r.id, action);
  sessIdx++; showSessCard();
}

function sessCopy() {
  navigator.clipboard.writeText(document.getElementById('sess-msg').value);
  toast('📋 Copied');
}

async function endSession() {
  document.getElementById('session').classList.remove('on');
  document.getElementById('sess-done').style.display = 'none';
  await loadQueue();
}

// ── History ───────────────────────────────────────────────────────────────────

async function loadHistory() {
  const days = document.getElementById('hist-days').value;
  document.getElementById('hist-body').innerHTML = 'Loading…';
  try {
    // Load history archive + today's ready_queue together
    const [histData, queueData] = await Promise.all([
      gasGet({ action: 'history', days }),
      gasGet({ action: 'queue_all' })
    ]);
    if (histData && histData.error) {
      document.getElementById('hist-body').innerHTML = '❌ ' + histData.error;
      return;
    }
    const hist  = Array.isArray(histData)  ? histData  : [];
    const queue = Array.isArray(queueData) ? queueData : [];
    // Merge today's queue rows not already in history (dedup by id)
    const histIds = new Set(hist.map(r => r.id));
    const todayRows = queue.filter(r => !histIds.has(r.id));
    histRows = [...hist, ...todayRows];
    renderHistory();
  } catch(e) { document.getElementById('hist-body').innerHTML = '❌ Could not load history.'; }
}

function renderHistory() {
  const q = (document.getElementById('hist-q').value || '').toLowerCase();
  const rows = q ? histRows.filter(r => String(r.name||'').toLowerCase().includes(q) || String(r.event_type||'').toLowerCase().includes(q)) : histRows;
  const sent = rows.filter(r => r.action_status === 'sent').length;
  const skipped = rows.filter(r => r.action_status === 'skipped').length;
  const edited = rows.filter(r => r.action_status === 'edited').length;
  const days = new Set(rows.map(r => r.queue_date)).size;
  document.getElementById('hist-stats').innerHTML = `
    <div class="stat"><div class="stat-n">${rows.length}</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" style="color:#1a7a42">${sent}</div><div class="stat-l">Sent</div></div>
    <div class="stat"><div class="stat-n" style="color:#856404">${edited}</div><div class="stat-l">Edited</div></div>
    <div class="stat"><div class="stat-n" style="color:#666">${skipped}</div><div class="stat-l">Skipped</div></div>
    <div class="stat"><div class="stat-n">${days}</div><div class="stat-l">Days</div></div>`;
  if (!rows.length) { document.getElementById('hist-body').innerHTML = '<p style="color:#777;font-size:13px">No records found.</p>'; return; }
  const sorted = [...rows].sort((a,b) => String(b.queue_date).localeCompare(String(a.queue_date)));
  const colors = { sent:'#1a7a42', skipped:'#666', edited:'#856404', ready:'#1a56db' };
  document.getElementById('hist-body').innerHTML = `
    <table class="htbl">
      <thead><tr><th>Date</th><th>Name</th><th>Event</th><th>Status</th><th>Time</th></tr></thead>
      <tbody>${sorted.map(r => `<tr>
        <td>${esc(r.queue_date)}</td>
        <td>${esc(r.name)}</td>
        <td>${esc(r.event_type)}</td>
        <td style="color:${colors[r.action_status]||'#333'};font-weight:600">${esc(r.action_status)}</td>
        <td style="color:#999;font-size:11px">${r.action_ts ? String(r.action_ts).replace('T',' ').substring(0,16) : '—'}</td>
      </tr>`).join('')}</tbody>
    </table>`;
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadQueue();
</script>
